[project]
name = "scholarpi-knowledge"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["mcp>=2,<3", "pymupdf>=1.26,<2", "numpy>=2,<3", "sentence-transformers>=5,<6", "docling>=2,<3", "uvicorn>=0.35,<1"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
